[project]
name = "capstone-research-system"
version = "0.1.0"
description = "AI Venture & Company Research System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.19.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "langgraph>=0.2.0",
    "groq>=0.11.0",
    "google-generativeai>=0.8.0",
    "tavily-python>=0.5.0",
    "typing_extensions>=4.12.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "requests>=2.34.2",
]
